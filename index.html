.text-\[var\(--muted\)\] {
  color: var(--muted);
}

.text-\[var\(--navy\)\] {
  color: var(--navy);
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.underline {
  text-decoration-line: underline;
}

.underline-offset-4 {
  text-underline-offset: 4px;
}

.shadow-md {
  --tw-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 4px 6px -1px var(--tw-shadow-color), 0 2px 4px -2px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-sm {
  --tw-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.\[overflow-wrap\:anywhere\] {
  overflow-wrap: anywhere;
}

:root {
  --navy: #0A2A4D;
  --navy-2: #123F6E;
  --surface: #EEF3F8;
  --card: #FFFFFF;
  --ink: #122335;
  --muted: #60758C;
  --line: #D9E3EC;
  --green: #0E7A4F;
  --green-bg: #E6F6EE;
  --red: #B4232F;
  --red-bg: #FDECEC;
  --amber: #FFF4D6;
  --accent: #F2B705;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #071A30;
    --card: #0E2C4E;
    --ink: #F1F6FB;
    --muted: #B7C8D9;
    --line: #274764;
    --green-bg: #123F32;
    --red-bg: #4A1B21;
    --amber: #41320F;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--surface);
}

body {
  margin: 0;
  min-width: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: "Aptos", "Segoe UI", system-ui, -apple-system, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.quiz-title {
  font-family: Georgia, "Times New Roman", serif;
}

.option-card {
  transition: transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
}

.option-card:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 5px 18px rgba(10,42,77,.10);
}

.option-card:focus-visible, .action-btn:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.progress-track {
  height: 10px;
  overflow: hidden;
  background: rgba(255,255,255,.22);
  border-radius: 999px;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width .3s ease;
}

.hover\:bg-white\/10:hover {
  background-color: rgb(255 255 255 / 0.1);
}

.dark\:bg-\[\#163B5E\]:is(.dark *) {
  --tw-bg-opacity: 1;
  background-color: rgb(22 59 94 / var(--tw-bg-opacity, 1));
}

.dark\:bg-transparent:is(.dark *) {
  background-color: transparent;
}

@media (min-width: 640px) {
  .sm\:order-1 {
    order: 1;
  }

  .sm\:order-2 {
    order: 2;
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:justify-center {
    justify-content: center;
  }

  .sm\:justify-between {
    justify-content: space-between;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-8 {
    padding-top: 2rem;
    padding-bottom: 2rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}
